<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14362b">
<meta name="robots" content="noindex, nofollow">
<title>Prospection · Inner Clarity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#faf8f4;--white:#fff;--forest:#14362b;--forest-deep:#0e231c;--sage:#527d54;--sage-light:#7fa98c;--sage-tint:#e8efe9;
  --line:#ebe8e2;--line-strong:#cfc9bd;--ink:#1b1b1b;--ink2:#4a4a4a;--ink3:#5a5a5a;--ink4:#6a6a6a;
  --warm-bg:#fbf2e6;--warm-ink:#a06522;--blue-bg:#ecf2fb;--blue-ink:#3a5fa0;--rose-ink:#a84953;
  --serif:'Fraunces',Georgia,serif;--sans:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--forest)}
.wrap{max-width:780px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 28px) 18px 120px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--sage)}
h1{margin:4px 0 0;font:italic 400 clamp(32px,6vw,40px)/1.05 var(--serif);letter-spacing:-.02em;color:var(--forest)}
h2{margin:0;font-size:19px;font-weight:700;letter-spacing:-.01em}
.sub{margin:6px 0 0;color:var(--ink3);font-weight:300}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.avatar{flex:none;width:44px;height:44px;border-radius:50%;border:0;background:var(--forest);color:#f5f3ee;font-weight:600}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;padding:3px;border-radius:999px;background:#efebe4;margin:0 0 16px}
.seg button{height:40px;border:0;border-radius:999px;background:transparent;font-size:14px;font-weight:600;color:var(--ink3)}
.seg button[aria-pressed=true]{background:#fff;color:var(--forest);box-shadow:0 1px 4px rgba(20,54,43,.14)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden}
.section{margin:22px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 4px}
.muted{color:var(--ink4);font-size:13px}
.row{display:flex;gap:12px;padding:14px 16px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.ini{flex:none;width:40px;height:40px;border-radius:50%;background:var(--sage-tint);color:var(--forest);display:flex;align-items:center;justify-content:center;font:italic 18px var(--serif)}
.grow{flex:1;display:flex;flex-direction:column;gap:4px}
.line1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.name{font-weight:600;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
.plat{font-size:10.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
.plat.instagram{color:var(--rose-ink)}.plat.facebook{color:var(--blue-ink)}
.time{margin-left:auto;font-size:12.5px;color:var(--ink4);white-space:nowrap}
.text{margin:0;font-size:14px;line-height:1.45;color:var(--ink2);overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--sage-tint);color:var(--forest)}
.chip.warm{background:var(--warm-bg);color:var(--warm-ink)}.chip.blue{background:var(--blue-bg);color:var(--blue-ink)}.chip.grey{background:#f1eee8;color:var(--ink3)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.btn{height:40px;padding:0 16px;border-radius:999px;border:1.5px solid var(--line-strong);background:transparent;color:var(--forest);font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--forest);border-color:var(--forest);color:#fff}
.btn.small{height:36px;padding:0 13px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.empty{padding:22px 18px;color:var(--ink4);font-size:14.5px;text-align:center}
.vocal{background:var(--forest);border-radius:26px;padding:18px 18px 10px;color:#f5f3ee}
.vocal .kicker{color:var(--sage-light)}
.vocal h2{font:400 24px/1.2 var(--serif);color:#f5f3ee;margin:4px 0 8px}
.vrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-top:1px solid rgba(245,243,238,.12)}
.vrow .who{flex:1;display:flex;flex-direction:column}
.vrow .who b{font-size:15px}.vrow .who span{font-size:12.5px;color:#c9d8cd}
.vbtn{height:40px;padding:0 14px;border-radius:999px;border:1px solid rgba(245,243,238,.3);background:transparent;color:#f5f3ee;font-size:13px;font-weight:600}
.vbtn.fill{background:#f5f3ee;color:var(--forest);border-color:#f5f3ee}
.transfer{background:var(--warm-bg);border:1px solid #f0dfc6;border-radius:18px;padding:12px 14px;margin-top:8px;font-size:14px;color:#6b4515}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;height:46px;padding:0 14px;border:1.5px solid var(--line-strong);border-radius:14px;background:#fff;font-size:16px}
textarea{height:auto;min-height:96px;padding:12px 14px;line-height:1.45;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink3);margin:12px 0 6px}
.stages{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin:0 0 14px;scrollbar-width:none}
.stages button{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line-strong);background:#fff;font-size:13px;font-weight:600;color:var(--ink3)}
.stages button[aria-pressed=true]{background:var(--forest);border-color:var(--forest);color:#fff}
.tl{position:relative;padding-left:18px;margin:8px 0}
.tl:before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;padding:8px 0}
.ev:before{content:"";position:absolute;left:-17px;top:14px;width:10px;height:10px;border-radius:50%;background:#fff;border:2px solid var(--sage)}
.ev.out:before{background:var(--forest);border-color:var(--forest)}
.ev .meta{font-size:12px;color:var(--ink4);font-weight:600}
.ev p{margin:2px 0 0;font-size:14.5px;color:var(--ink2);overflow-wrap:anywhere}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.kpi b{display:block;font:400 34px/1.05 var(--serif);color:var(--forest)}
.kpi span{font-size:13px;color:var(--ink4);font-weight:600}
.bar{height:6px;border-radius:999px;background:#f1eee8;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--sage-light);border-radius:999px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(250,248,244,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(env(safe-area-inset-bottom) + 6px);display:grid;grid-template-columns:repeat(4,auto);justify-content:space-around;z-index:10}
nav.tabs a{min-width:48px;padding-left:2px;padding-right:2px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--ink4);text-decoration:none;position:relative}
nav.tabs a[aria-current=page]{color:var(--forest)}
nav.tabs svg{width:24px;height:24px}
.badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:#c84d4d;color:#fff;font-size:11px;line-height:18px;text-align:center}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 86px);transform:translateX(-50%);background:var(--forest-deep);color:#f5f3ee;padding:10px 16px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:90vw}
.toast.show{opacity:1}
.login{max-width:420px;margin:0 auto;padding:12vh 20px 40px}
.err{color:#a3332b;font-size:14px;margin-top:10px}
.back{display:inline-flex;align-items:center;gap:4px;height:44px;font-weight:500;text-decoration:none;color:var(--forest)}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.dialog{position:fixed;inset:0;background:rgba(14,35,28,.35);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:12px}
.sheet{background:#fff;border-radius:24px;padding:20px;width:100%;max-width:480px;margin-bottom:env(safe-area-inset-bottom)}
.auto{padding:18px 18px 8px;margin-bottom:14px}
.auto-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.kw{font:italic 400 30px/1.1 var(--serif);color:var(--forest);margin:2px 0 0;letter-spacing:-.01em}
.modes{display:flex;flex-direction:column;gap:4px;margin:10px 0 12px;font-size:14px;color:var(--ink2)}
.modes .plat{display:inline-block;min-width:78px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.mini{background:var(--cream);border-radius:16px;padding:10px 12px}
.mini b{display:block;font:400 26px/1.1 var(--serif);color:var(--forest)}
.mini span{font-size:12px;color:var(--ink4);font-weight:600}
.frow{margin-top:10px}
.frow .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.frow .top em{font-style:normal;color:var(--ink4);font-size:12.5px;margin-left:6px}
details.msgs{border-top:1px solid var(--line);margin-top:14px}
details.msgs summary{cursor:pointer;list-style:none;padding:12px 0;font-weight:600;font-size:14px;color:var(--forest)}
details.msgs summary::-webkit-details-marker{display:none}
details.msgs summary:after{content:" ›";}
details.msgs[open] summary:after{content:" ⌄";}
.mlabel{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sage);margin:12px 0 6px}
.bubble{background:var(--sage-tint);border-radius:16px 16px 16px 4px;padding:10px 12px;font-size:14px;line-height:1.45;color:var(--ink);margin:0 0 6px;overflow-wrap:anywhere}
.qbtn{display:inline-block;border:1.5px solid var(--sage);color:var(--forest);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:600;margin:0 0 8px}
.ph{background:#fff;border:1px dashed var(--sage-light);border-radius:6px;padding:0 4px;color:var(--sage);font-weight:600}
.note{font-size:13px;color:var(--ink4);margin:4px 2px 18px}
@media(min-width:900px){
  nav.tabs{top:0;bottom:0;right:auto;width:96px;grid-template-columns:1fr;grid-auto-rows:72px;align-content:start;padding-top:28px;border-top:0;border-right:1px solid var(--line)}
  .wrap{padding-left:120px;max-width:900px}
  .toast{bottom:32px}
  .dialog{align-items:center}
}
@media(prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<div id="app" aria-live="polite"><main class="login"><div class="kicker">Inner Clarity</div><h1>Prospection.</h1><p class="sub">Chargement…</p></main></div>
<div id="toast" class="toast" role="status"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.2/dist/umd/supabase.js"></script>
<script>
{
const APP_VERSION = "2026-11-26.7";
const SUPABASE_URL = "https://ytrjfjfeyzbzyrefyqgb.supabase.co";
const SUPABASE_KEY = "sb_publishable_4RgNkgjYq8yuEgB6zh2Kgg_rgMCoXJg";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, storageKey: "ic-prospection" } });

const STAGES = [
  ["nouveau", "Nouveau"], ["premier_message", "Premier message"], ["reponse", "A répondu"],
  ["appel_propose", "Appel proposé"], ["appel_reserve", "Appel réservé"], ["client", "Client"], ["perdu", "Pas intéressé"],
];
const STAGE = Object.fromEntries(STAGES);
const KIND = { comment: "Commentaire", reply: "Réponse sous le commentaire", dm_in: "Message reçu", dm_out: "Message envoyé", auto: "Message automatique" };

const S = { session: null, me: null, members: [], contacts: [], todo: [], autos: [], events: [], drafts: [], comments: [], media: {}, edits: {}, caseFilter: "", source: new Map(), sourceFilter: "", filter: "all", stageFilter: "", search: "", plusTab: "rdv", period: 30 };
const app = document.getElementById("app");

// ---------- utilitaires ----------
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const canEdit = () => S.me && ["admin", "setter"].includes(S.me.role);
const isAdmin = () => S.me && S.me.role === "admin";
const label = (c) => c ? (c.username ? "@" + c.username : (c.display_name || "Sans nom")) : "";
const initial = (c) => (c?.username || c?.display_name || "?").replace(/^@/, "").charAt(0).toUpperCase();
const memberName = (id) => S.members.find((m) => m.user_id === id)?.display_name || "";
const setterName = () => S.members.find((m) => m.role === "setter" && m.active)?.display_name || "Léo";
const sourceOf = (id) => S.source.get(id) || "autre";
const SOURCES = [["presence", "Présence"], ["lead_magnet", "Lead magnet"], ["autre", "Autres"]];
const pendingDraft = (i) => S.drafts.some((d) => ["a_valider", "valide", "envoi"].includes(d.status) && (d.interaction_id === i.id || d.comment_id === i.external_id));
function ago(d) {
  if (!d) return "";
  const s = (Date.now() - new Date(d).getTime()) / 1000;
  if (s < 60) return "à l'instant";
  if (s < 3600) return `il y a ${Math.floor(s / 60)} min`;
  if (s < 86400) return `il y a ${Math.floor(s / 3600)} h`;
  if (s < 7 * 86400) return `il y a ${Math.floor(s / 86400)} j`;
  return new Date(d).toLocaleDateString("fr-BE", { day: "numeric", month: "short" });
}
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200);
}
async function copy(text) {
  try { await navigator.clipboard.writeText(text); toast("Pseudo copié : " + text); }
  catch { toast("Copie impossible, sélectionne le pseudo à la main"); }
}
function profileLink(c) {
  return c.platform === "instagram" && c.username ? `https://instagram.com/${encodeURIComponent(c.username)}` : "";
}
const ICON = {
  today: '<path d="M3 13h5l1.5 3h5l1.5-3h5"/><path d="M5.5 5h13L21 13v6H3v-6z"/>',
  vocal: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.8c1.5.8 2.6 2.6 3 5.2"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  more: '<path d="M5 20v-7M12 20V5M19 20v-10"/>',
  bolt: '<path d="M13 3 5 13.5h6L10 21l8-10.5h-6z"/>',
  chat: '<path d="M4.5 5h15a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H10l-4.5 3.5V16h-1a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/>',
};
const svg = (k) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[k]}</svg>`;

// ---------- données ----------
async function loadAll() {
  const since = new Date(Date.now() - 14 * 86400000).toISOString();
  const [m, c, t, a, e, d, k, md] = await Promise.all([
    sb.from("team_members").select("*").order("created_at"),
    sb.from("contacts").select("*").order("last_activity_at", { ascending: false }).limit(2000),
    sb.from("interactions").select("*").eq("handled", false).order("created_at", { ascending: false }).limit(300),
    sb.from("automations").select("*").order("sort"),
    sb.from("automation_events").select("keyword,contact_id,platform,event,ok,created_at").order("created_at", { ascending: false }).limit(10000),
    sb.from("reply_drafts").select("*").gte("created_at", since).order("created_at", { ascending: false }).limit(1000),
    sb.from("interactions").select("*").eq("kind", "comment").gte("created_at", since).order("created_at", { ascending: false }).limit(1000),
    sb.from("media").select("*"),
  ]);
  S.comments = k.data || [];
  S.media = Object.fromEntries((md.data || []).map((x) => [x.id, x]));
  S.members = m.data || [];
  S.contacts = c.data || [];
  S.todo = t.data || [];
  S.autos = a.data || [];
  S.events = e.data || [];
  S.drafts = d.data || [];
  // Case de chaque prospect : Présence en priorité, sinon Lead magnet
  const cat = Object.fromEntries(S.autos.map((x) => [x.keyword, x.category]));
  S.source = new Map();
  for (const ev of S.events) {
    if (ev.event !== "trigger") continue;
    const k = cat[ev.keyword];
    if (k === "presence" || (k === "lead_magnet" && !S.source.has(ev.contact_id))) S.source.set(ev.contact_id, k);
  }
  S.me = S.members.find((x) => x.user_id === S.session?.user?.id && x.active) || null;
}
const contactById = (id) => S.contacts.find((c) => c.id === id);

async function logActivity(contactId, action, note) {
  await sb.from("activity").insert({ contact_id: contactId, actor_id: S.me.user_id, action, note: note || null });
}
async function updateContact(id, patch) {
  const { error } = await sb.from("contacts").update(patch).eq("id", id);
  if (error) { toast("Erreur : " + error.message); return false; }
  Object.assign(contactById(id) || {}, patch);
  return true;
}
async function markHandled(contactId) {
  const { error } = await sb.from("interactions").update({ handled: true, handled_by: S.me.user_id, handled_at: new Date().toISOString() })
    .eq("contact_id", contactId).eq("handled", false);
  if (error) return toast("Erreur : " + error.message);
  S.todo = S.todo.filter((i) => i.contact_id !== contactId);
  toast("Marqué comme traité");
  render();
}

// ---------- écrans ----------
function nav(active) {
  const vocals = S.contacts.filter((c) => c.needs_vocal && !c.do_not_contact).length;
  const tabs = [
    ["prospects", "Prospects", "people", dmGroups().length + S.contacts.filter((c) => (c.transfer_note && c.owner_id === S.me?.user_id) || (c.handoff_note && !c.do_not_contact)).length],
    ["vocaux", "Vocaux", "vocal", vocals],
    ["automatisations", "Automatisations", "bolt", 0],
    ["plus", "Plus", "more", 0],
  ];
  return `<nav class="tabs" aria-label="Navigation">${tabs.map(([h, l, i, n]) =>
    `<a href="#${h}" ${active === h ? 'aria-current="page"' : ""}>${svg(i)}${n ? `<span class="badge">${n}</span>` : ""}${esc(l)}</a>`).join("")}</nav>`;
}

function header(kicker, title, sub) {
  return `<div class="head"><div><div class="kicker">${esc(kicker)}</div><h1>${esc(title)}</h1>${sub ? `<p class="sub">${esc(sub)}</p>` : ""}</div>
  <button class="avatar" data-act="logout" aria-label="Se déconnecter (${esc(S.me?.display_name)})" title="Se déconnecter">${esc((S.me?.display_name || "?").charAt(0))}</button></div>`;
}

// Messages privés reçus, pas encore traités, regroupés par personne
function dmGroups() {
  const map = new Map();
  for (const i of S.todo) {
    if (i.kind !== "dm_in") continue;
    const c = contactById(i.contact_id);
    if (!c || c.do_not_contact) continue;
    if (!map.has(c.id)) map.set(c.id, { c, items: [] });
    map.get(c.id).items.push(i);
  }
  return [...map.values()];
}

function seg() {
  return `<div class="seg" role="group" aria-label="Plateforme">${[["all", "Tout"], ["instagram", "Instagram"], ["facebook", "Facebook"]].map(([k, l]) =>
    `<button data-act="filter" data-v="${k}" aria-pressed="${S.filter === k}">${l}</button>`).join("")}</div>`;
}

function contactRow(c, text, time, extra = "") {
  const owner = c.owner_id ? memberName(c.owner_id) : "";
  return `<div class="row">
    <span class="ini" aria-hidden="true">${esc(initial(c))}</span>
    <div class="grow">
      <div class="line1"><a class="name" href="#p-${c.id}">${esc(label(c))}</a><span class="plat ${c.platform}">${c.platform === "instagram" ? "Instagram" : "Facebook"}</span><span class="time">${esc(ago(time))}</span></div>
      ${text ? `<p class="text">${esc(text)}</p>` : ""}
      <div class="chips"><span class="chip grey">${esc(STAGE[c.stage] || c.stage)}</span>${owner ? `<span class="chip blue">${esc(owner)}</span>` : ""}</div>

const MODE = {
  ressource: { instagram: "Bouton « abonné », puis le lien", facebook: "Bouton, puis le lien" },
  question: { instagram: "Question en privé", facebook: "Question en privé, Claude s'en occupe" },
  vocal: { instagram: "Vocal pour Robin", facebook: "Vocal pour Robin" },
  off: { instagram: "Rien", facebook: "Rien" },
};

function modeText(a, p) {
  const m = p === "instagram" ? a.mode_instagram : a.mode_facebook;
  if (m === "question") return `Claude écrit en privé${a.first_delay_minutes ? ` ${a.first_delay_minutes} min après` : ""}, puis répond sous le commentaire`;
  if (m === "vocal") return "Vocal de Robin, puis Claude répond sous le commentaire";
  return MODE[m]?.[p] || "";
}

function autoStats(a) {
  const since = S.period ? Date.now() - S.period * 86400000 : 0;
  const ev = S.events.filter((e) => e.keyword === a.keyword && e.ok && new Date(e.created_at).getTime() >= since && (S.filter === "all" || e.platform === S.filter));
  const people = (type) => new Set(ev.filter((e) => e.event === type).map((e) => e.contact_id));
  const trig = people("trigger");
  const reacted = new Set([...people("click"), ...people("reply")]);
  const inTrig = (fn) => [...trig].filter((id) => { const c = contactById(id); return c && fn(c); }).length;
  const vocalTrig = ev.filter((e) => e.event === "trigger" && (e.platform === "instagram" ? a.mode_instagram : a.mode_facebook) === "vocal").map((e) => e.contact_id);
  return {
    trig: trig.size, dm: people("dm").size, click: people("click").size, res: people("resource").size,
    rep: people("reply").size, rel: people("relance").size, fu: people("followup").size, reacted: reacted.size,
    vocalTodo: new Set(vocalTrig).size, vocalDone: [...new Set(vocalTrig)].filter((id) => contactById(id) && !contactById(id).needs_vocal).length,
    calls: inTrig((c) => ["appel_reserve", "client"].includes(c.stage)), clients: inTrig((c) => c.stage === "client"),
  };
}

const pct = (n, d) => (d ? Math.round((n / d) * 100) + " %" : "");
const tpl = (t, a) => esc(t || "").replaceAll("{prenom}", '<span class="ph">prénom</span>').replaceAll("{lien}", esc(a.resource_url || ""));

function autoCard(a) {
  const st = autoStats(a);
  const modes = [a.mode_instagram, a.mode_facebook];
  const has = (m) => modes.includes(m);
  const rows = [["Commentaires", st.trig]];
  if (has("ressource") || has("question")) rows.push(["Messages privés envoyés", st.dm]);
  if (has("ressource")) rows.push(["Ont cliqué sur le bouton", st.click], ["Liens envoyés", st.res], ["Messages de suivi", st.fu]);
  if (has("question")) rows.push(["Ont répondu en privé", st.rep]);
  if (has("ressource") || has("question")) rows.push(["Relances publiques", st.rel]);
  if (has("vocal")) rows.push(["Vocaux envoyés", st.vocalDone]);
  rows.push(["Appels réservés", st.calls], ["Clients", st.clients]);
  const max = Math.max(1, st.trig);
  const msg = [];
  if (has("question")) msg.push(`<div class="mlabel">Message privé${a.mode_facebook === "question" && a.mode_instagram !== "question" ? " · Facebook" : ""}</div><p class="bubble">${tpl(a.question_text, a)}</p>`);
  if (a.mode_instagram === "ressource") msg.push(`<div class="mlabel">Message privé · Instagram</div><p class="bubble">${tpl(a.welcome_instagram, a)}</p><span class="qbtn">${esc(a.button_instagram || "")}</span>`);
  if (a.mode_facebook === "ressource") msg.push(`<div class="mlabel">Message privé · Facebook</div><p class="bubble">${tpl(a.welcome_facebook, a)}</p><span class="qbtn">${esc(a.button_facebook || "")}</span>`);
  if (a.mode_instagram === "ressource" && a.not_following_text) msg.push(`<div class="mlabel">Si pas encore abonné (Instagram)</div><p class="bubble">${tpl(a.not_following_text, a)}</p>`);
  if (has("ressource")) msg.push(`<div class="mlabel">Après le clic</div><p class="bubble">${tpl(a.resource_text, a)}</p>`);
  if (has("ressource") && a.followup_text) msg.push(`<div class="mlabel">${a.followup_hours} h plus tard</div><p class="bubble">${tpl(a.followup_text, a)}</p>`);
  if ((has("ressource") || has("question")) && a.public_replies?.length) msg.push(`<div class="mlabel">Réponse publique, une au hasard</div>${a.public_replies.map((r) => `<p class="bubble">${tpl(r, a)}</p>`).join("")}`);
  if ((has("ressource") || has("question")) && a.relance_replies?.length) msg.push(`<div class="mlabel">Relance publique après ${a.relance_hours} h sans réaction</div>${a.relance_replies.map((r) => `<p class="bubble">${tpl(r, a)}</p>`).join("")}`);
  return `<section class="card auto">
    <div class="auto-head"><div><div class="kicker">Mot-clé</div><h2 class="kw">${esc(a.label)}</h2></div><span class="chip ${a.active ? "" : "grey"}">${a.active ? "Actif" : "En pause"}</span></div>
    <div class="modes"><div><span class="plat instagram">Instagram</span>${esc(modeText(a, "instagram"))}</div><div><span class="plat facebook">Facebook</span>${esc(modeText(a, "facebook"))}</div>${a.handover_to_setter ? `<div><span class="plat" style="color:var(--sage)">Ensuite</span>${esc(setterName())} prend la relève quand la personne répond</div>` : ""}</div>
    <div class="minis"><div class="mini"><span>Commentaires</span><b>${st.trig}</b></div><div class="mini"><span>Ont réagi</span><b>${has("vocal") && !has("ressource") && !has("question") ? st.vocalDone : st.reacted}</b></div><div class="mini"><span>Appels</span><b>${st.calls}</b></div></div>
    ${rows.map(([l, n]) => `<div class="frow"><div class="top"><span>${l}</span><b>${n}<em>${l === "Commentaires" ? "" : pct(n, st.trig)}</em></b></div><div class="bar"><i style="width:${Math.max(2, Math.round((n / max) * 100))}%"></i></div></div>`).join("")}
    ${msg.length ? `<details class="msgs"><summary>Voir les messages</summary>${msg.join("")}<p class="note"><span class="ph">prénom</span> est remplacé par le prénom sur Facebook. Sur Instagram, la phrase part sans prénom.</p></details>` : ""}
  </section>`;
}

    ${needsSetup ? `<label for="l-name">Prénom</label><input id="l-name" type="text" required autocomplete="given-name">` : ""}
    <label for="l-email">Email</label><input id="l-email" type="email" required autocomplete="email">
    <label for="l-pwd">Mot de passe${needsSetup ? " (8 caractères minimum)" : ""}</label><input id="l-pwd" type="password" required minlength="${needsSetup ? 8 : 1}" autocomplete="${needsSetup ? "new-password" : "current-password"}">
    <div class="btns" style="margin-top:18px"><button class="btn primary" type="submit">${needsSetup ? "Créer mon compte" : "Se connecter"}</button></div>
    ${error ? `<p class="err">${esc(error)}</p>` : ""}
  </form></main>`;
}

// ---------- rendu ----------
async function render() {
  let h = location.hash.replace("#", "") || "prospects";
  if (["aujourdhui", "commentaires"].includes(h)) h = "prospects";
  if (!S.session) {
    const { data } = await sb.functions.invoke("team", { body: { action: "status" } });
    app.innerHTML = viewLogin(!!data?.needsSetup);
    return;
  }
  if (!S.me) {
    app.innerHTML = `<main class="login"><div class="kicker">Inner Clarity</div><h1>Accès en attente.</h1><p class="sub">Ton compte n'a pas (ou plus) accès à l'app. Demande à Robin.</p><div class="btns"><button class="btn" data-act="logout">Se déconnecter</button></div></main>`;
    return;
  }
  let html;
  if (h.startsWith("p-")) html = await viewContact(h.slice(2));
  else if (h === "vocaux") html = viewVocals();
  else if (h === "prospects") html = viewProspects();
  else if (h === "automatisations") html = viewAutomationsPage();
  else if (h === "rdv") { S.plusTab = "rdv"; html = viewPlus(); }
  else if (h === "plus") html = viewPlus();
  else html = viewProspects();
  const y = window.scrollY, keepScroll = render._last === h;
  app.innerHTML = html;
  render._last = h;
  if (keepScroll) window.scrollTo(0, y);
}

async function refresh() {
  if (!S.session) return render();
  await loadAll();
  await render();
}

// ---------- actions ----------
app.addEventListener("click", async (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.tagName === "SELECT" || b.tagName === "INPUT") return;
  const act = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  if (act === "copy") return copy(v);
  if (act === "filter") { S.filter = v; return render(); }
  if (act === "stagef") { S.stageFilter = v; return render(); }
  if (act === "plustab") { S.plusTab = v; return render(); }
  if (act === "sourcef") { S.sourceFilter = v; return render(); }
  if (act === "period") { S.period = Number(v); return render(); }
  if (act === "logout") {
    if (S.me) return dialog(`<h2>Se déconnecter ?</h2><p class="sub">Connecté en tant que ${esc(S.me.display_name)}.</p>`, logout);
    return logout();
  }
  if (!canEdit()) return;
  b.disabled = true;
  if (act === "done") return markHandled(id);
  if (act === "dm-done") {
    const { error } = await sb.from("interactions").update({ handled: true, handled_by: S.me.user_id, handled_at: new Date().toISOString() })
      .eq("contact_id", id).eq("kind", "dm_in").eq("handled", false);
    if (error) { b.disabled = false; return toast("Erreur : " + error.message); }
    toast("Marqué comme traité");
    return refresh();
  }


  if (act === "draft-ok" || act === "draft-skip") {
    const d = S.drafts.find((x) => String(x.id) === id);
    const patch = act === "draft-ok"
      ? { status: "valide", draft: (document.getElementById("d-" + id)?.value || d.draft).trim() }
      : { status: "ignore" };
    if (act === "draft-ok" && !patch.draft) { b.disabled = false; return toast("La réponse est vide"); }
    const { error } = await sb.from("reply_drafts").update(patch).eq("id", d.id);
    if (error) { b.disabled = false; return toast("Erreur : " + error.message); }
    if (act === "draft-skip" && d.interaction_id) {
      await sb.from("interactions").update({ handled: true, handled_by: S.me.user_id, handled_at: new Date().toISOString() }).eq("id", d.interaction_id);
    }
    if (act === "draft-ok") {
      toast("Publication…");
      const token = (await sb.auth.getSession()).data.session?.access_token;
      const res = await fetch(`${SUPABASE_URL}/functions/v1/meta-webhook?app=send_reply`, {
        method: "POST",
        headers: { Authorization: `Bearer ${token}`, apikey: SUPABASE_KEY, "Content-Type": "application/json" },
        body: JSON.stringify({ id: d.id }),
      }).then((r) => r.json()).catch(() => null);
      toast(res?.ok ? "Réponse publiée" : "Validée : elle part dans 2 minutes au plus tard");
    } else toast("Commentaire ignoré");
    return refresh();
  }
  if (act === "handoff-done") {
    if (await updateContact(id, { handoff_note: null, stage: ["nouveau", "premier_message"].includes(contactById(id)?.stage) ? "premier_message" : contactById(id)?.stage })) {
      await logActivity(id, "repris en privé");
      toast("Noté comme pris en charge");
      render();
    }
    return;
  }
  if (act === "seen") { await updateContact(id, { transfer_note: null }); return render(); }
  if (act === "vocal-done") {
    if (await updateContact(id, { needs_vocal: false, stage: ["nouveau"].includes(contactById(id)?.stage) ? "premier_message" : contactById(id)?.stage })) {
      await logActivity(id, "vocal envoyé"); toast("Vocal noté. Je réponds sous son commentaire dans quelques minutes."); render();
    }
    return;
  }
  if (act === "to-vocal") { if (await updateContact(id, { needs_vocal: true, vocal_reason: "Ajouté par " + S.me.display_name })) { toast("Ajouté aux vocaux"); render(); } return; }
  if (act === "stage") { if (await updateContact(id, { stage: v })) { await logActivity(id, "étape : " + STAGE[v]); render(); } return; }
  if (act === "notes") {
    const notes = document.getElementById("notes").value;
    if (await updateContact(id, { notes })) { toast("Note enregistrée"); b.disabled = false; }
    return;
  }
  if (act === "transfer") return openTransfer(id, b.dataset.to);
  if (act === "active") return teamCall({ action: "update", user_id: id, active: v === "1" }, v === "1" ? "Accès rétabli" : "Accès coupé");
  if (act === "pwd") return openPassword(id);
});

app.addEventListener("change", async (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (act === "owner") { if (await updateContact(id, { owner_id: el.value || null })) { await logActivity(id, "responsable : " + (memberName(el.value) || "personne")); toast("Responsable mis à jour"); } }
  if (act === "dnc") { if (await updateContact(id, { do_not_contact: el.value === "1" })) toast(el.value === "1" ? "Ne sera plus proposé" : "De nouveau à prospecter"); }
  if (act === "role") teamCall({ action: "update", user_id: id, role: el.value }, "Rôle mis à jour");
});

app.addEventListener("input", (e) => {
  if (e.target.dataset.act === "search") {
    S.search = e.target.value;
    const pos = e.target.selectionStart;
    render().then(() => { const s = document.getElementById("search"); if (s) { s.focus(); s.setSelectionRange(pos, pos); } });
  }
});

app.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, btn = f.querySelector("button[type=submit]");
  btn.disabled = true;
  if (kind === "login" || kind === "bootstrap") {
    const email = document.getElementById("l-email").value.trim(), password = document.getElementById("l-pwd").value;
    if (kind === "bootstrap") {
      const { data, error } = await sb.functions.invoke("team", { body: { action: "bootstrap", email, password, display_name: document.getElementById("l-name").value } });
      const msg = data?.error || (error && (await error.context?.json?.().catch(() => null))?.error) || (error ? "Création impossible." : "");
      if (msg) { app.innerHTML = viewLogin(true, msg); return; }
    }
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { app.innerHTML = viewLogin(false, "Email ou mot de passe incorrect."); return; }
    S.session = data.session;
    return refresh();
  }
  if (kind === "invite") {
    await teamCall({
      action: "invite", display_name: document.getElementById("i-name").value, email: document.getElementById("i-email").value,
      password: document.getElementById("i-pwd").value, role: document.getElementById("i-role").value,
    }, "Personne ajoutée");
  }
});

async function logout() { await sb.auth.signOut(); S.session = null; S.me = null; location.hash = ""; render(); }

async function teamCall(body, ok) {
  const { data, error } = await sb.functions.invoke("team", { body });
  let msg = data?.error;
  if (!msg && error) msg = (await error.context?.json?.().catch(() => null))?.error || "Action impossible.";
  if (msg) { toast(msg); return render(); }
  toast(ok); return refresh();
}

function dialog(html, onSubmit) {
  const d = document.createElement("div");
  d.className = "dialog";
  d.innerHTML = `<form class="sheet">${html}<div class="btns" style="margin-top:16px"><button class="btn primary" type="submit">Valider</button><button class="btn" type="button" data-close>Annuler</button></div></form>`;
  document.body.appendChild(d);
  const close = () => d.remove();
  d.addEventListener("click", (e) => { if (e.target === d || e.target.closest("[data-close]")) close(); });
  d.querySelector("form").addEventListener("submit", async (e) => { e.preventDefault(); await onSubmit(d); close(); });
  setTimeout(() => d.querySelector("textarea,input")?.focus(), 30);
}

function openTransfer(id, to) {
  const c = contactById(id), name = memberName(to);
  dialog(`<h2>Transférer ${esc(label(c))} à ${esc(name)}</h2><label for="t-note">Un mot pour ${esc(name)}</label><textarea id="t-note" placeholder="Ex. : elle hésite sur le prix, propose-lui l'appel"></textarea>`, async (d) => {
    const note = d.querySelector("#t-note").value.trim() || "À voir";
    if (await updateContact(id, { owner_id: to, transfer_note: `${S.me.display_name} : ${note}` })) {
      await logActivity(id, "transféré à " + name, note);
      toast("Transféré à " + name); render();
    }
  });
}

function openPassword(id) {
  dialog(`<h2>Nouveau mot de passe pour ${esc(memberName(id))}</h2><label for="p-new">Mot de passe (8 caractères minimum)</label><input id="p-new" type="text" minlength="8" required autocomplete="off">`, async (d) => {
    await teamCall({ action: "reset_password", user_id: id, password: d.querySelector("#p-new").value }, "Mot de passe changé");
  });
}

// ---------- mise à jour automatique : recharge si une nouvelle version est en ligne ----------
async function checkVersion() {
  try {
    const res = await fetch(location.pathname + "?check=" + Date.now(), { cache: "no-store" });
    const live = (await res.text()).match(/APP_VERSION = "([^"]+)"/)?.[1];
    if (live && live !== APP_VERSION && !document.querySelector(".dialog") && !["TEXTAREA", "INPUT"].includes(document.activeElement?.tagName)) {
      location.replace(location.pathname + "?v=" + encodeURIComponent(live) + location.hash);
    }
  } catch { /* hors ligne : on garde la version actuelle */ }
}

// ---------- démarrage ----------
window.addEventListener("hashchange", render);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { checkVersion(); refresh(); } });
checkVersion();
setInterval(() => { if (!document.hidden && !document.querySelector(".dialog") && document.activeElement?.tagName !== "TEXTAREA" && document.activeElement?.tagName !== "INPUT") { checkVersion(); refresh(); } }, 60000);
sb.auth.onAuthStateChange((_e, session) => { S.session = session; });
sb.auth.getSession().then(({ data }) => { S.session = data.session; refresh(); });
}
</script>
